name: Build and Package (32-bit Windows)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (32-bit)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          architecture: x86

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Vite bundles
        run: yarn build

      - name: Get latest commit message
        id: commitmsg
        run: echo "msg=$(git log -1 --pretty=%B | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Determine publish flag
        id: publishflag
        shell: bash
        run: |
          if [[ "${{ steps.commitmsg.outputs.msg }}" =~ [0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Electron App for 32-bit Windows
        shell: bash
        run: |
          PUBLISH_FLAG=""
          if [[ "${{ steps.publishflag.outputs.publish }}" == "true" ]]; then
            PUBLISH_FLAG="--publish always"
          fi

          yarn electron-builder build --config electron-builder.config.cjs --win --ia32 $PUBLISH_FLAG
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
